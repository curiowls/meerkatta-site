name: Validate website

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run check:seo
      - run: npm run check:api
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  production-smoke:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Wait for this release, separately from IndexNow
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        run: node scripts/wait-for-deployment.mjs
      - name: Check public routes and checkout assets without opening a payment
        run: npm run check:production
